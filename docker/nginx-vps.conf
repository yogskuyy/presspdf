server {
    listen 80;
    server_name your-domain.com; # Ganti dengan domain atau IP server VPS Anda

    # Path root harus mengarah ke folder public proyek PressPDF
    root /var/www/presspdf/public;
    index index.php index.html;

    # Pengaturan upload PDF berukuran besar hingga 1 GB & batas timeout 15 menit
    client_max_body_size 1024M;
    client_body_timeout 900s;
    client_header_timeout 900s;

    # Routing Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Penanganan PHP-FPM 8.2 Socket Ubuntu
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_read_timeout 900s;
        fastcgi_send_timeout 900s;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }

    # Blokir akses ke file tersembunyi seperti .env atau .git
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
