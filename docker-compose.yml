version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: presspdf-app
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - APP_NAME=PressPDF
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://localhost
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=presspdf
      - DB_USERNAME=presspdf_user
      - DB_PASSWORD=presspdf_secret
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.11
    container_name: presspdf-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secret_password
      MYSQL_DATABASE: presspdf
      MYSQL_USER: presspdf_user
      MYSQL_PASSWORD: presspdf_secret
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  storage_data:
  db_data:
